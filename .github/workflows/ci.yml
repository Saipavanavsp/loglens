name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      live_model:
        description: "Also run the regression subset live against an Ollama model tag (e.g. hf.co/<user>/<repo>:Q4_K_M)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.17" "black>=26.10"
      - run: ruff check src tests dashboard training learning
      - run: black --check src tests dashboard training learning

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      # CPU-only torch keeps the mini-transformer tests fast and the install small.
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e ".[data,gateway,eval,dashboard,dev]"
      - run: pytest --cov=loglens --cov-report=term-missing:skip-covered
        env:
          # Tests never call paid APIs; make sure nothing could.
          ANTHROPIC_API_KEY: ""
          LOGLENS_DRY_RUN: "true"

  eval-regression:
    # No API money in CI: recompute metrics from recorded model outputs on a fixed
    # golden subset and fail if quality drops below evals/thresholds.json.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[eval]"
      - run: python -m loglens.evals.regression --mode replay

  eval-live:
    # Manual: pull the model from the Hub into Ollama and run the same subset live (CPU).
    if: github.event_name == 'workflow_dispatch' && inputs.live_model != ''
    runs-on: ubuntu-latest
    needs: test
    services:
      ollama:
        image: ollama/ollama:0.40.8
        ports: ["11434:11434"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[eval,gateway]"
      - name: Pull model
        run: |
          curl -sf http://localhost:11434/api/pull -d "{\"model\": \"${{ inputs.live_model }}\", \"stream\": false}"
      - run: python -m loglens.evals.regression --mode ollama --ollama-tag "${{ inputs.live_model }}"
        env:
          LOGLENS_OLLAMA_THREADS: "4"
