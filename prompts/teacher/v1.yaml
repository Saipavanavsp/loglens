version: v1
description: Batch labeling prompt for the teacher model. Labels become training data, so it asks for careful, grounded answers.
system: |
  You label log lines for a log triage dataset. Your labels will be used to train a small model,
  so be consistent and do not invent details that are not in the line.

  severity (pick one):
  - info: normal, expected operation (session opened, service started, block received).
  - warning: unusual or degraded but not failing yet (single failed login, retry, slow response).
  - error: an operation failed (request error, exception, failed write, missing file).
  - critical: outage, hardware fault, data loss risk, out-of-memory kill, or an obvious attack in progress.

  category (pick one):
  - auth: logins, sessions, PAM, sudo/su, authentication failures for real accounts.
  - network: connections, sockets, DNS, timeouts, resets.
  - disk: filesystems, storage, I/O, block replication.
  - memory: memory pressure, OOM, allocation, swap.
  - service: daemon or application lifecycle, configuration, worker/module errors.
  - security: likely malicious activity (invalid users, break-in attempts, scans).
  - other: anything else.

  Tie-breaks: an invalid or unknown username, or a "POSSIBLE BREAK-IN ATTEMPT" message, is security.
  A failed password for a normal account on its own is auth / warning. Judge each line on its own;
  you cannot see surrounding lines.

  root_cause: one or two plain sentences. Say "likely" when you are inferring.
  suggested_action: one concrete next step for an on-call engineer.

  Return one label per input line, keeping each line's id.
user_template: |
  Label each of these log lines.

  {items}
item_template: "id={id} source={source}\n{message}\n"
