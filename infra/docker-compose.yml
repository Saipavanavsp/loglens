# Full local stack. From the repo root:
#   docker compose -f infra/docker-compose.yml up -d --build
# Needs a .env in the repo root (copy .env.example). Ports are bound to localhost only.
name: loglens

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://loglens:loglens@postgres:5432/loglens
  REDIS_URL: redis://redis:6379/0
  OLLAMA_BASE_URL: http://ollama:11434
  MLFLOW_TRACKING_URI: http://mlflow:5000
  OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4318

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: loglens
      POSTGRES_PASSWORD: loglens  # local-only; change for anything shared
      POSTGRES_DB: loglens
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["127.0.0.1:5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loglens -d loglens"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    volumes: [redisdata:/data]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  ollama:
    image: ollama/ollama:0.40.8
    environment:
      OLLAMA_KEEP_ALIVE: 24h   # keep the model loaded between requests
    volumes:
      - ollama-models:/root/.ollama
      - ./ollama:/models:ro    # Modelfile + exported GGUF
    # Host port 11435 by default so it doesn't clash with a native Ollama install on 11434.
    ports: ["127.0.0.1:${OLLAMA_HOST_PORT:-11435}:11434"]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama-init:
    image: ollama/ollama:0.40.8
    depends_on:
      ollama: {condition: service_healthy}
    environment:
      OLLAMA_HOST: http://ollama:11434
      LOGLENS_LOCAL_MODEL: ${LOGLENS_LOCAL_MODEL:-loglens-qwen2.5-1.5b}
    volumes: ["./ollama:/models:ro"]
    entrypoint: ["/bin/sh", "/models/init.sh"]
    restart: "no"

  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.17.2
    command: >
      mlflow server --host 0.0.0.0 --port 5000
      --backend-store-uri sqlite:////mlflow/mlflow.db
      --artifacts-destination /mlflow/artifacts
      --allowed-hosts "*"
    volumes: [mlflowdata:/mlflow]
    ports: ["127.0.0.1:5000:5000"]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=2)"]
      interval: 10s
      timeout: 5s
      retries: 10

  jaeger:
    image: jaegertracing/jaeger:2.11.0   # accepts OTLP on 4317/4318, UI on 16686
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"

  gateway:
    build:
      context: ..
      dockerfile: infra/gateway.Dockerfile
    env_file: [../.env]
    environment:
      <<: *app-env
    volumes: ["../configs:/app/configs:ro"]   # edit routing/canary config without rebuilding
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      ollama: {condition: service_healthy}
      ollama-init: {condition: service_completed_successfully}
    ports: ["127.0.0.1:8000:8000"]
    stop_grace_period: 30s

  dashboard:
    build:
      context: ..
      dockerfile: infra/dashboard.Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://loglens:loglens@postgres:5432/loglens
    volumes: ["../reports:/app/reports:ro"]
    depends_on:
      postgres: {condition: service_healthy}
    ports: ["127.0.0.1:8501:8501"]

volumes:
  pgdata:
  redisdata:
  mlflowdata:
  ollama-models:
    name: loglens_ollama   # shared with the dev container so the base model isn't pulled twice
