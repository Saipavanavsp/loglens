[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "loglens"
version = "0.1.0"
description = "Log triage gateway: a fine-tuned small LLM with Claude fallback, evals and LLMOps."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "orjson>=3.10",
]

[project.optional-dependencies]
# Dataset download, parsing and teacher labeling.
data = [
    "anthropic>=0.40",
    "tenacity>=9.0",
    "rapidfuzz>=3.9",
    "tqdm>=4.66",
]
# Gateway service.
gateway = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "anthropic>=0.40",
    "redis>=5.0",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "numpy>=1.26",
    "prometheus-client>=0.20",
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "opentelemetry-instrumentation-fastapi>=0.48b0",
    "pyyaml>=6.0",
]
# Embeddings for the semantic cache (pulls in torch; kept separate so CI stays light).
embeddings = ["sentence-transformers>=3.0"]
# Eval harness.
eval = [
    "anthropic>=0.40",
    "scikit-learn>=1.5",
    "matplotlib>=3.9",
    "mlflow>=2.16",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "tabulate>=0.9",
]
dashboard = [
    "streamlit>=1.38",
    "pandas>=2.2",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "altair>=5.4",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "respx>=0.21",
    "fakeredis>=2.24",
    "ruff>=0.6",
    "black>=24.8",
    "pre-commit>=3.8",
]

[tool.hatch.build.targets.wheel]
packages = ["src/loglens"]

[tool.black]
line-length = 100
target-version = ["py312"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "S", "N"]
ignore = [
    "E501",  # black owns line length
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]  # asserts and fake secrets are fine in tests

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q"
